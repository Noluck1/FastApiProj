[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]

strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

exclude = [
    "\\.venv",
    "venv",
]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "app_auth/tests",
    "app_books/tests",
]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = [
    "app_auth",
    "app_books",
    "shared",
]
branch = true

[tool.coverage.report]
show_missing = true